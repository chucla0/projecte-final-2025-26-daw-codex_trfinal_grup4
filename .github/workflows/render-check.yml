name: Render container check

on:
  push:
    branches: [deploy-gratis]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U codex" --health-interval=5s
          --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: docker build -f deploy/render/Dockerfile -t codex-backend .

      - name: Start with Render's free memory limit
        run: |
          DEMO_PASSWORD="$(openssl rand -hex 12)"; ADMIN_PASSWORD="$(openssl rand -hex 12)"
          echo "DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name codex --network host --memory 512m --memory-swap 512m \
            -e PORT=10000 -e APP_NAME=Codex -e APP_ENV=production -e APP_DEBUG=false -e RENDER=true \
            -e APP_KEY="$(openssl rand -base64 32)" -e LOG_CHANNEL=stderr -e LOG_LEVEL=warning \
            -e DB_CONNECTION=pgsql -e DB_SSLMODE=disable -e DB_URL=postgresql://codex:codex@127.0.0.1:5432/codex \
            -e FRONTEND_URL=http://localhost:5173 -e REDIS_CLIENT=phpredis -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PREFIX=tfg-database- -e BROADCAST_CONNECTION=redis -e CACHE_STORE=redis \
            -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync -e MAIL_MAILER=array \
            -e AI_MODERATION_ENABLED=false -e REGISTRATION_ENABLED=false -e SEED_DEMO=true \
            -e DEMO_PASSWORD="$DEMO_PASSWORD" -e ADMIN_PASSWORD="$ADMIN_PASSWORD" codex-backend
          for i in $(seq 1 60); do
            curl -fsS http://localhost:10000/api/health && exit 0
            sleep 3
          done
          exit 1

      - name: Smoke test
        run: |
          npm ci --prefix socket
          BASE=http://localhost:10000 node deploy/render/smoke.mjs

      - name: Restart keeps data and does not reseed
        run: |
          docker restart codex
          for i in $(seq 1 60); do curl -fsS http://localhost:10000/api/health && break; sleep 3; done
          docker logs codex 2>&1 | grep -q "Users already exist"
          docker stats --no-stream codex

      - name: Logs
        if: failure()
        run: docker logs codex 2>&1 | tail -200
