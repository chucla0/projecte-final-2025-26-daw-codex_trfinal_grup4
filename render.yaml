services:
  - type: web
    name: codex-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - { key: APP_NAME, value: Codex }
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_KEY, generateValue: true }
      - { key: LOG_CHANNEL, value: stderr }
      - { key: LOG_LEVEL, value: warning }
      - { key: DB_CONNECTION, value: pgsql }
      - { key: DB_SSLMODE, value: require }
      - { key: DB_URL, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: REDIS_CLIENT, value: phpredis }
      - { key: REDIS_HOST, value: 127.0.0.1 }
      - { key: REDIS_PREFIX, value: tfg-database- }
      - { key: BROADCAST_CONNECTION, value: redis }
      - { key: CACHE_STORE, value: redis }
      - { key: SESSION_DRIVER, value: array }
      - { key: QUEUE_CONNECTION, value: sync }
      - { key: MAIL_MAILER, value: array }
      - { key: AI_MODERATION_ENABLED, value: "false" }
      - { key: REGISTRATION_ENABLED, value: "false" }
      - { key: SEED_DEMO, value: "true" }
      - { key: DEMO_PASSWORD, generateValue: true }
      - { key: ADMIN_PASSWORD, generateValue: true }
